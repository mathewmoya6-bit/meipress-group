<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEI Press Group | Admin Login</title>
<meta name="description" content="MEI Press Group administration portal">

<style>
*{box-sizing:border-box}
body{
margin:0;
min-height:100vh;
font-family:Inter,Arial,sans-serif;
background:linear-gradient(135deg,#06111f,#0b1f35);
display:flex;
align-items:center;
justify-content:center;
padding:20px;
color:#fff
}
.login-card{
width:100%;
max-width:430px;
background:#fff;
color:#172033;
border-radius:18px;
padding:38px;
box-shadow:0 25px 70px rgba(0,0,0,.35)
}
.logo{
width:64px;
height:64px;
border-radius:15px;
background:#0b1f35;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
font-weight:800;
color:#9bea00;
margin-bottom:20px
}
h1{
margin:0 0 8px;
font-size:25px
}
.subtitle{
margin:0 0 28px;
color:#667085;
font-size:14px
}
label{
display:block;
font-weight:600;
font-size:14px;
margin:0 0 7px
}
input{
width:100%;
padding:13px 14px;
border:1px solid #d8dee8;
border-radius:9px;
font-size:15px;
outline:none;
margin-bottom:17px
}
input:focus{
border-color:#0b1f35;
box-shadow:0 0 0 3px rgba(11,31,53,.08)
}
button{
width:100%;
border:0;
border-radius:9px;
padding:14px;
background:#0b1f35;
color:#fff;
font-size:15px;
font-weight:700;
cursor:pointer
}
button:hover{
background:#102c4b
}
button:disabled{
opacity:.6;
cursor:not-allowed
}
.error{
display:none;
background:#fff0f0;
border:1px solid #ffcaca;
color:#b42318;
padding:11px 13px;
border-radius:8px;
font-size:13px;
margin-bottom:17px
}
.success{
display:none;
background:#effaf3;
border:1px solid #b7ebc6;
color:#16703b;
padding:11px 13px;
border-radius:8px;
font-size:13px;
margin-bottom:17px
}
.footer{
text-align:center;
margin-top:22px;
font-size:12px;
color:#98a2b3
}
</style>
</head>

<body>

<div class="login-card">

<div class="logo">MEI</div>

<h1>MEI Admin Portal</h1>
<p class="subtitle">Sign in to manage applications, training sessions and registrations.</p>

<div id="errorMessage" class="error"></div>
<div id="successMessage" class="success"></div>

<form id="loginForm">

<label for="email">Email address</label>
<input
id="email"
type="email"
autocomplete="username"
placeholder="admin@example.com"
required
>

<label for="password">Password</label>
<input
id="password"
type="password"
autocomplete="current-password"
placeholder="Enter your password"
required
>

<button id="loginButton" type="submit">
Sign In
</button>

</form>

<div class="footer">
MEI Press Group Administration
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL="https://qkchnrrxrewmlvvxuuqe.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_-ki98JwzbWWiVXm7nzAAgQ_5H2qjXz7";

const supabaseClient=supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

const form=document.getElementById("loginForm");
const emailInput=document.getElementById("email");
const passwordInput=document.getElementById("password");
const loginButton=document.getElementById("loginButton");
const errorMessage=document.getElementById("errorMessage");
const successMessage=document.getElementById("successMessage");

function showError(message){
errorMessage.textContent=message;
errorMessage.style.display="block";
successMessage.style.display="none";
}

function showSuccess(message){
successMessage.textContent=message;
successMessage.style.display="block";
errorMessage.style.display="none";
}

async function checkExistingSession(){

const{
data:{session}
}=await supabaseClient.auth.getSession();

if(!session)return;

const{
data:user,
error
}=await supabaseClient
.from("admin_users")
.select("id,email,full_name,role,active")
.eq("id",session.user.id)
.maybeSingle();

if(error)return;

if(user&&user.active!==false){

localStorage.setItem(
"mei_admin_session",
JSON.stringify({
authenticated:true,
accessToken:session.access_token,
user:{
id:session.user.id,
email:session.user.email,
full_name:user.full_name,
role:user.role
}
})
);

window.location.href="admin.html";
}
}

form.addEventListener("submit",async e=>{

e.preventDefault();

errorMessage.style.display="none";
successMessage.style.display="none";

const email=emailInput.value.trim();
const password=passwordInput.value;

loginButton.disabled=true;
loginButton.textContent="Signing in...";

try{

const{
data,
error
}=await supabaseClient.auth.signInWithPassword({
email,
password
});

if(error)throw error;

if(!data.session){
throw new Error("Login succeeded but no authentication session was created.");
}

const{
data:adminUser,
error:adminError
}=await supabaseClient
.from("admin_users")
.select("id,email,full_name,role,active")
.eq("id",data.user.id)
.maybeSingle();

if(adminError)throw adminError;

if(!adminUser){
await supabaseClient.auth.signOut();
throw new Error("Your account is authenticated but is not registered as an MEI administrator.");
}

if(adminUser.active===false){
await supabaseClient.auth.signOut();
throw new Error("Your MEI administrator account is inactive.");
}

localStorage.setItem(
"mei_admin_session",
JSON.stringify({
authenticated:true,
accessToken:data.session.access_token,
user:{
id:data.user.id,
email:data.user.email,
full_name:adminUser.full_name,
role:adminUser.role
}
})
);

showSuccess("Login successful. Opening administration dashboard...");

setTimeout(()=>{
window.location.href="admin.html";
},500);

}catch(error){

console.error("ADMIN LOGIN ERROR:",error);

let message=error.message||"Unable to sign in.";

if(message.toLowerCase().includes("invalid login credentials")){
message="Incorrect email or password.";
}

showError(message);

loginButton.disabled=false;
loginButton.textContent="Sign In";
}
});

checkExistingSession();
</script>

</body>
</html>
