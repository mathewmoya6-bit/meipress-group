<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | MEI Press Group</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --primary: #00b4d8;
            --primary-dark: #0090b0;
            --primary-light: #66d9ff;
            --secondary: #0b1a2e;
            --bg: #f1f5f9;
            --text: #0f172a;
            --text-secondary: #64748b;
            --text-light: #94a3b8;
            --border: #e2e8f0;
            --red: #ef4444;
            --green: #10b981;
            --radius: 16px;
            --radius-sm: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #0b1a2e 0%, #0d2748 50%, #0b1a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--text);
            position: relative;
            overflow: hidden;
        }

        /* Decorative background orbs */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            width: 400px;
            height: 400px;
            background: var(--primary);
            top: -100px;
            right: -100px;
            animation: float 12s ease-in-out infinite;
        }
        body::after {
            width: 300px;
            height: 300px;
            background: #7c3aed;
            bottom: -80px;
            left: -80px;
            animation: float 15s ease-in-out infinite reverse;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* Login card */
        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card {
            background: #ffffff;
            border-radius: var(--radius);
            padding: 44px 40px 36px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Brand */
        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 28px;
        }
        .brand-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 900;
            font-size: 1.2rem;
            letter-spacing: -0.5px;
            margin-bottom: 14px;
            box-shadow: 0 10px 30px rgba(0, 180, 216, 0.35);
        }
        .brand h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.5px;
        }
        .brand h1 span { color: var(--primary); }
        .brand p {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 4px;
            text-align: center;
        }

        /* Alert */
        .alert {
            display: none;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 20px;
            align-items: flex-start;
            gap: 10px;
            line-height: 1.5;
        }
        .alert.show { display: flex; }
        .alert.error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid var(--red);
        }
        .alert.success {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid var(--green);
        }
        .alert i { margin-top: 2px; }

        /* Form */
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 7px;
            letter-spacing: 0.2px;
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap i.field-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 0.9rem;
            transition: color 0.2s;
            pointer-events: none;
        }
        .form-group input {
            width: 100%;
            padding: 13px 44px 13px 42px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.95rem;
            background: #f8fafc;
            color: var(--text);
            outline: none;
            transition: all 0.2s ease;
        }
        .form-group input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(0, 180, 216, 0.12);
        }
        .form-group input:focus ~ i.field-icon {
            color: var(--primary);
        }
        .form-group input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Password toggle */
        .toggle-pass {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .toggle-pass:hover {
            color: var(--text);
            background: #f1f5f9;
        }

        /* Row: remember + forgot */
        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 0.85rem;
        }
        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--text-secondary);
            font-weight: 500;
            user-select: none;
        }
        .remember input {
            width: auto;
            margin: 0;
            accent-color: var(--primary);
            cursor: pointer;
        }
        .forgot {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        .forgot:hover { color: var(--primary-dark); }

        /* Submit button */
        .btn-login {
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 20px rgba(0, 180, 216, 0.28);
        }
        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 180, 216, 0.4);
        }
        .btn-login:active:not(:disabled) {
            transform: translateY(0);
        }
        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Footer */
        .login-footer {
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-light);
        }
        .login-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        .login-footer a:hover { color: var(--primary-dark); }

        /* Back link */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 18px;
            color: rgba(255, 255, 255, 0.65);
            font-size: 0.82rem;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        .back-link:hover { color: #fff; }
        .back-link i { font-size: 0.75rem; }

        .wrapper-below {
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-card { padding: 32px 24px 28px; }
            .brand h1 { font-size: 1.3rem; }
            .brand-icon { width: 50px; height: 50px; font-size: 1.05rem; }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="brand">
                <div class="brand-icon">MEI</div>
                <h1>MEI <span>Admin</span></h1>
                <p>Sign in to access the admin dashboard</p>
            </div>

            <!-- Alert -->
            <div class="alert" id="alertBox">
                <i class="fas fa-info-circle" id="alertIcon"></i>
                <span id="alertMessage"></span>
            </div>

            <!-- Login Form -->
            <form id="loginForm" autocomplete="on" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrap">
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="username"
                            required
                        />
                        <i class="fas fa-envelope field-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        />
                        <i class="fas fa-lock field-icon"></i>
                        <button
                            type="button"
                            class="toggle-pass"
                            id="togglePass"
                            aria-label="Show password"
                        >
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-row">
                    <label class="remember">
                        <input type="checkbox" id="remember" checked>
                        Remember me
                    </label>
                    <a href="#" class="forgot" id="forgotLink">Forgot password?</a>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i>
                    Sign In
                </button>
            </form>

            <div class="login-footer">
                Protected area · &copy; <span id="year"></span> MEI Press Holdings Ltd.
            </div>
        </div>

        <div class="wrapper-below">
            <a href="index.html" class="back-link">
                <i class="fas fa-arrow-left"></i>
                Back to Website
            </a>
        </div>
    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ============================================================
        // MEI GROUP – ADMIN LOGIN
        // Authenticates against Supabase Auth, then verifies admin role
        // ============================================================

        // -------- CONFIG --------
        const SUPABASE_URL      = 'https://qkchnrrxrewmlvvxuuqe.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_-ki98JwzbWWiVXm7nzAAgQ_5H2qjXz7';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // -------- DOM --------
        const form       = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passInput  = document.getElementById('password');
        const remember   = document.getElementById('remember');
        const loginBtn   = document.getElementById('loginBtn');
        const alertBox   = document.getElementById('alertBox');
        const alertIcon  = document.getElementById('alertIcon');
        const alertMsg   = document.getElementById('alertMessage');
        const togglePass = document.getElementById('togglePass');
        const toggleIcon = document.getElementById('toggleIcon');
        const forgotLink = document.getElementById('forgotLink');

        document.getElementById('year').textContent = new Date().getFullYear();

        // -------- SESSION GUARD --------
        // If already logged in with a valid admin session, skip login
        (function checkExistingSession() {
            const session = localStorage.getItem('mei_admin_session');
            if (!session) return;
            try {
                const data = JSON.parse(session);
                if (data && data.email) {
                    showAlert('success', 'Already signed in. Redirecting...');
                    setTimeout(() => window.location.href = 'admin.html', 700);
                }
            } catch (_) {
                localStorage.removeItem('mei_admin_session');
            }
        })();

        // -------- HELPERS --------
        function showAlert(type, message) {
            alertBox.className = 'alert show ' + type;
            alertMsg.textContent = message;
            alertIcon.className = type === 'error'
                ? 'fas fa-exclamation-circle'
                : type === 'success'
                ? 'fas fa-check-circle'
                : 'fas fa-info-circle';
        }

        function hideAlert() {
            alertBox.className = 'alert';
        }

        function setLoading(isLoading) {
            loginBtn.disabled = isLoading;
            loginBtn.innerHTML = isLoading
                ? '<i class="fas fa-spinner fa-spin"></i> Signing in...'
                : '<i class="fas fa-sign-in-alt"></i> Sign In';
            emailInput.disabled = isLoading;
            passInput.disabled = isLoading;
        }

        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || '').trim());
        }

        // -------- TOGGLE PASSWORD --------
        togglePass.addEventListener('click', function () {
            const isPassword = passInput.type === 'password';
            passInput.type = isPassword ? 'text' : 'password';
            toggleIcon.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
            togglePass.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
        });

        // -------- FORGOT PASSWORD --------
        forgotLink.addEventListener('click', async function (e) {
            e.preventDefault();
            const email = emailInput.value.trim();

            if (!isValidEmail(email)) {
                showAlert('error', 'Enter your email above first, then click "Forgot password?".');
                emailInput.focus();
                return;
            }

            hideAlert();
            try {
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/admin-login.html'
                });
                if (error) throw error;
                showAlert('success', 'Password reset link sent to ' + email + '. Check your inbox.');
            } catch (err) {
                showAlert('error', err.message || 'Could not send reset link.');
            }
        });

        // -------- LOGIN --------
        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            hideAlert();

            const email    = emailInput.value.trim().toLowerCase();
            const password = passInput.value;

            // -------- VALIDATION --------
            if (!email) {
                showAlert('error', 'Please enter your email address.');
                emailInput.focus();
                return;
            }
            if (!isValidEmail(email)) {
                showAlert('error', 'Please enter a valid email address.');
                emailInput.focus();
                return;
            }
            if (!password) {
                showAlert('error', 'Please enter your password.');
                passInput.focus();
                return;
            }
            if (password.length < 6) {
                showAlert('error', 'Password must be at least 6 characters.');
                passInput.focus();
                return;
            }

            // -------- SUBMIT --------
            setLoading(true);

            try {
                // 1. Authenticate against Supabase Auth
                const { data: authData, error: authError } =
                    await supabaseClient.auth.signInWithPassword({ email, password });

                if (authError) {
                    // Convert common Supabase errors into friendly messages
                    const msg = (authError.message || '').toLowerCase();
                    if (msg.includes('invalid login credentials')) {
                        throw new Error('Invalid email or password. Please try again.');
                    }
                    if (msg.includes('email not confirmed')) {
                        throw new Error('Your email is not confirmed yet. Contact an administrator.');
                    }
                    if (msg.includes('too many requests')) {
                        throw new Error('Too many login attempts. Please wait a few minutes.');
                    }
                    throw authError;
                }

                if (!authData || !authData.user) {
                    throw new Error('Sign-in failed. Please try again.');
                }

                const user = authData.user;

                // 2. Verify the user is an admin
                //    (checks admin_users table; falls back to email allow-list
                //     if the table hasn't been created yet)
                let isAdmin = false;
                let adminRole = 'admin';

                try {
                    const { data: adminRow, error: adminErr } = await supabaseClient
                        .from('admin_users')
                        .select('role')
                        .eq('user_id', user.id)
                        .maybeSingle();

                    if (!adminErr && adminRow) {
                        isAdmin = true;
                        adminRole = adminRow.role || 'admin';
                    }
                } catch (_) {
                    // Table may not exist — silently fall through
                }

                // Fallback allow-list (matches the account you created via SQL)
                const ADMIN_ALLOWLIST = ['mathewmoya6@gmail.com'];
                if (!isAdmin && ADMIN_ALLOWLIST.includes(email)) {
                    isAdmin = true;
                }

                if (!isAdmin) {
                    // Log them back out — they're authenticated but not an admin
                    await supabaseClient.auth.signOut();
                    throw new Error('This account does not have admin access.');
                }

                // 3. Persist session for admin.html
                const sessionPayload = {
                    id:          user.id,
                    email:       user.email,
                    name:        user.user_metadata?.full_name || email.split('@')[0],
                    role:        adminRole,
                    accessToken: authData.session?.access_token || null,
                    loginTime:   new Date().toISOString()
                };

                if (remember.checked) {
                    localStorage.setItem('mei_admin_session', JSON.stringify(sessionPayload));
                } else {
                    sessionStorage.setItem('mei_admin_session', JSON.stringify(sessionPayload));
                    // Also mirror to localStorage so admin.html can find it
                    localStorage.setItem('mei_admin_session', JSON.stringify(sessionPayload));
                }

                // 4. Success → redirect
                showAlert('success', 'Welcome back! Redirecting to dashboard...');
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 700);

            } catch (err) {
                console.error('Login error:', err);
                showAlert('error', err.message || 'Something went wrong. Please try again.');
                setLoading(false);
                passInput.value = '';
                passInput.focus();
            }
        });

        // -------- ENTER KEY (submit) --------
        [emailInput, passInput].forEach(input => {
            input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    form.requestSubmit();
                }
            });
        });

        // -------- CLEAR ALERT ON TYPING --------
        [emailInput, passInput].forEach(input => {
            input.addEventListener('input', hideAlert);
        });

    </script>
</body>
</html>
