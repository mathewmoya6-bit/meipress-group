<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Training Registration | MEI Group</title>
<meta name="description" content="Register for an MEI Group training session.">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,Helvetica,sans-serif;
background:#f4f7f9;
color:#17212b;
line-height:1.6
}
.container{
width:min(900px,92%);
margin:auto
}
header{
background:#071a2b;
color:#fff;
padding:18px 0
}
.header-inner{
display:flex;
justify-content:space-between;
align-items:center;
gap:20px
}
.logo{
font-size:22px;
font-weight:800
}
.logo span{color:#18c77a}
.back{
color:#fff;
font-size:14px
}
main{
padding:45px 0 70px
}
.card{
background:#fff;
border:1px solid #dfe7ec;
border-radius:15px;
box-shadow:0 6px 25px rgba(7,26,43,.07);
overflow:hidden
}
.card-header{
background:#071a2b;
color:#fff;
padding:28px
}
.card-header h1{
font-size:30px;
margin-bottom:8px
}
.card-header p{
color:#cbd9e0
}
.session-summary{
padding:24px 28px;
background:#f8fafb;
border-bottom:1px solid #e3eaee
}
.session-summary h2{
color:#071a2b;
margin-bottom:10px
}
.summary-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}
.summary-item{
font-size:13px;
color:#687984
}
.summary-item strong{
display:block;
font-size:14px;
color:#263642
}
.form{
padding:28px
}
.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px
}
.form-group{
display:flex;
flex-direction:column;
gap:6px
}
.form-group.full{
grid-column:1/-1
}
label{
font-size:13px;
font-weight:700;
color:#263642
}
input,
select,
textarea{
width:100%;
padding:12px 13px;
border:1px solid #ccd8df;
border-radius:8px;
font:inherit;
background:#fff
}
textarea{
min-height:110px;
resize:vertical
}
input:focus,
select:focus,
textarea:focus{
outline:none;
border-color:#18b977;
box-shadow:0 0 0 3px rgba(24,185,119,.1)
}
.checkbox{
display:flex;
gap:10px;
align-items:flex-start;
font-size:13px;
color:#53656f;
margin-top:5px
}
.checkbox input{
width:auto;
margin-top:4px
}
.submit{
margin-top:22px;
width:100%;
border:0;
background:#12b96f;
color:#fff;
padding:14px;
border-radius:8px;
font-size:15px;
font-weight:800;
cursor:pointer
}
.submit:hover{
background:#07985a
}
.submit:disabled{
opacity:.6;
cursor:not-allowed
}
.message{
display:none;
margin-bottom:20px;
padding:15px;
border-radius:8px;
font-size:14px
}
.message.success{
display:block;
background:#e8f8f0;
border:1px solid #a9dfc5;
color:#14653f
}
.message.error{
display:block;
background:#fff1f1;
border:1px solid #e2b6b6;
color:#8d2929
}
.loading{
padding:35px;
text-align:center
}
footer{
background:#071a2b;
color:#c8d5dc;
padding:30px 0;
font-size:13px
}
@media(max-width:650px){
.form-grid,
.summary-grid{
grid-template-columns:1fr
}
.form-group.full{
grid-column:auto
}
.header-inner{
align-items:flex-start
}
}
</style>
</head>

<body>

<header>
<div class="container header-inner">

<a href="training-calendar.html" class="logo">
MEI <span>GROUP</span>
</a>

<a href="training-calendar.html" class="back">
← Training Calendar
</a>

</div>
</header>

<main>

<div class="container">

<div id="loading" class="card">
<div class="loading">
Loading training session...
</div>
</div>

<div id="registrationCard" class="card" style="display:none">

<div class="card-header">
<h1>Training Registration</h1>
<p>Complete the form below to register for this training session.</p>
</div>

<div id="sessionSummary" class="session-summary"></div>

<div class="form">

<div id="message" class="message"></div>

<form id="registrationForm">

<div class="form-grid">

<div class="form-group">
<label for="full_name">Full Name *</label>
<input id="full_name" name="full_name" required>
</div>

<div class="form-group">
<label for="email">Email Address *</label>
<input id="email" name="email" type="email" required>
</div>

<div class="form-group">
<label for="phone">Phone Number *</label>
<input id="phone" name="phone" required>
</div>

<div class="form-group">
<label for="organization">Organization</label>
<input id="organization" name="organization">
</div>

<div class="form-group">
<label for="job_title">Job Title</label>
<input id="job_title" name="job_title">
</div>

<div class="form-group">
<label for="participant_type">Participant Type *</label>
<select id="participant_type" name="participant_type" required>
<option value="">Select</option>
<option value="individual">Individual</option>
<option value="corporate">Corporate</option>
<option value="organization">Organization</option>
</select>
</div>

<div class="form-group full">
<label for="notes">Additional Information</label>
<textarea id="notes" name="notes" placeholder="Any additional information..."></textarea>
</div>

<div class="form-group full">

<label class="checkbox">
<input type="checkbox" id="consent" required>
<span>
I confirm that the information provided is accurate and I agree
to be contacted by MEI Group regarding this training registration.
</span>
</label>

</div>

</div>

<button type="submit" class="submit" id="submitButton">
Complete Registration
</button>

</form>

</div>

</div>

</div>

</main>

<footer>
<div class="container">
MEI Group | +254 703 738 707 | info@meipressgroup.com
</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>

<script>

let supabaseClient;
let sessionData=null;

function escapeHTML(value){
return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function formatDate(date){

if(!date)return"";

return new Date(`${date}T00:00:00`)
.toLocaleDateString("en-KE",{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
});

}

function formatTime(time){

if(!time)return"";

const parts=time.split(":");
const h=parseInt(parts[0],10);
const m=parts[1]||"00";

const suffix=h>=12?"PM":"AM";
const hour=h%12||12;

return`${hour}:${m} ${suffix}`;

}

function showMessage(type,text){

const message=document.getElementById("message");

message.className=`message ${type}`;
message.textContent=text;

}

function getSessionId(){

const params=new URLSearchParams(
window.location.search
);

return params.get("session_id");

}

async function loadSession(){

const loading=document.getElementById("loading");
const card=document.getElementById("registrationCard");

try{

if(!window.supabaseClient){
throw new Error("Supabase client was not initialized.");
}

supabaseClient=window.supabaseClient;

const sessionId=getSessionId();

if(!sessionId){
throw new Error("No training session was selected.");
}

const{
data,
error
}=await supabaseClient
.from("training_sessions")
.select("*")
.eq("id",sessionId)
.eq("published",true)
.maybeSingle();

if(error)throw error;

if(!data){
throw new Error("The selected training session could not be found.");
}

if(
["cancelled","postponed"].includes(
String(data.status||"").toLowerCase()
)
){
throw new Error("This training session is no longer available.");
}

sessionData=data;

const venue=
data.venue||
data.location||
"MEI Group Training Centre";

const price=
Number(data.price||0)>0
?`${data.currency||"KES"} ${Number(data.price).toLocaleString("en-KE")}`
:"Contact MEI Group";

document.getElementById("sessionSummary").innerHTML=`

<h2>
${escapeHTML(data.session_title)}
</h2>

<div class="summary-grid">

<div class="summary-item">
Date
<strong>
${escapeHTML(formatDate(data.session_date))}
</strong>
</div>

<div class="summary-item">
Time
<strong>
${escapeHTML(formatTime(data.start_time))}
${
data.end_time
?` – ${escapeHTML(formatTime(data.end_time))}`
:""
}
</strong>
</div>

<div class="summary-item">
Venue
<strong>
${escapeHTML(venue)}
</strong>
</div>

<div class="summary-item">
Training Fee
<strong>
${escapeHTML(price)}
</strong>
</div>

</div>

`;

loading.style.display="none";
card.style.display="block";

}catch(error){

loading.innerHTML=`

<div class="loading">

<h2>Unable to load training session</h2>

<p style="margin-top:8px">
${escapeHTML(error.message)}
</p>

<p style="margin-top:18px">
<a href="training-calendar.html">
← Return to Training Calendar
</a>
</p>

</div>

`;

}

}

async function submitRegistration(event){

event.preventDefault();

const button=document.getElementById("submitButton");

button.disabled=true;
button.textContent="Submitting...";

try{

const form=new FormData(event.target);

const fullName=form.get("full_name").trim();
const email=form.get("email").trim().toLowerCase();
const phone=form.get("phone").trim();

if(!fullName||!email||!phone){
throw new Error("Please complete all required fields.");
}

const{
data:existing,
error:existingError
}=await supabaseClient
.from("training_registrations")
.select("id,registration_number")
.eq("session_id",sessionData.id)
.eq("email",email)
.not("registration_status","eq","cancelled")
.maybeSingle();

if(existingError)throw existingError;

if(existing){

throw new Error(
`This email is already registered for this session. Registration number: ${existing.registration_number||"already registered"}`
);

}

const{
count,
error:countError
}=await supabaseClient
.from("training_registrations")
.select("id",{count:"exact",head:true})
.eq("session_id",sessionData.id)
.in(
"registration_status",
["registered","confirmed","completed"]
);

if(countError)throw countError;

if(
sessionData.capacity&&
Number(count||0)>=Number(sessionData.capacity)
){

throw new Error(
"This training session is currently full."
);

}

const year=new Date().getFullYear();

const registrationNumber=
`MEI-TRN-${year}-${Date.now().toString().slice(-6)}`;

const amountDue=
Number(sessionData.price||0);

const amountPaid=0;

const paymentStatus=
amountDue<=0
?"paid"
:"unpaid";

const payload={

session_id:sessionData.id,

registration_number:registrationNumber,

full_name:fullName,

email:email,

phone:phone,

organization:
form.get("organization")?.trim()||null,

job_title:
form.get("job_title")?.trim()||null,

participant_type:
form.get("participant_type")||"individual",

amount_due:amountDue,

amount_paid:amountPaid,

payment_status:paymentStatus,

registration_status:"registered",

notes:
form.get("notes")?.trim()||null

};

const{
data,
error
}=await supabaseClient
.from("training_registrations")
.insert(payload)
.select()
.single();

if(error)throw error;

showMessage(
"success",
`Registration successful. Your registration number is ${data.registration_number||registrationNumber}. MEI Group will contact you with the next steps.`
);

event.target.reset();

button.textContent="Registration Completed";

}catch(error){

console.error("REGISTRATION ERROR:",error);

showMessage(
"error",
error.message||"Registration failed. Please try again."
);

button.disabled=false;
button.textContent="Complete Registration";

}

}

document.addEventListener("DOMContentLoaded",()=>{

document
.getElementById("registrationForm")
.addEventListener("submit",submitRegistration);

loadSession();

});

</script>

</body>
</html>
